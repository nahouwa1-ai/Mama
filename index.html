<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#243B6B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مبيعات الأكياس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--ink:#16222E;--muted:#5B6B7A;--line:#D9E0E7;
  --pri:#243B6B;--onpri:#FFFFFF;--soft:#E3E9F3;--amber:#F5B301;--lcd:#16222E;
  --red:#B3261E;--green:#1F7A5A;--warnbg:#FBE9E7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161D;--surface:#1A232D;--ink:#E8EDF2;--muted:#9AA9B8;--line:#2B3744;
    --pri:#8FA8E6;--onpri:#10161D;--soft:#243044;--amber:#F5B301;--lcd:#0A0F14;
    --red:#FF8A80;--green:#5CC9A0;--warnbg:#3A1F1D;
  }
}
:root[data-theme="dark"]{
  --bg:#10161D;--surface:#1A232D;--ink:#E8EDF2;--muted:#9AA9B8;--line:#2B3744;
  --pri:#8FA8E6;--onpri:#10161D;--soft:#243044;--amber:#F5B301;--lcd:#0A0F14;
  --red:#FF8A80;--green:#5CC9A0;--warnbg:#3A1F1D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Naskh Arabic',Tahoma,'Segoe UI',sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;font-weight:700;flex:1}
.demo{font-size:12px;background:var(--soft);color:var(--pri);padding:2px 10px;border-radius:99px;font-weight:600}
.icon-btn{background:none;border:0;padding:6px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}

main{padding:16px 16px 110px;max-width:560px;margin:0 auto}
h2{font-size:15px;margin:22px 0 8px;font-weight:600;color:var(--muted)}

/* scale readout - the one memorable element */
.lcd{background:var(--lcd);border-radius:18px;padding:16px 16px 14px;color:#fff;border:2px solid #2A3846}
.lcd label{font-size:13px;color:#9FB0C0;display:block}
.lcdrow{display:flex;align-items:baseline;gap:10px;direction:ltr;justify-content:flex-end}
.lcdrow input{background:transparent;border:0;color:var(--amber);font-size:56px;font-weight:700;width:100%;text-align:right;padding:0;letter-spacing:1px;font-variant-numeric:tabular-nums}
.lcdrow input::placeholder{color:#5C4A12}
.lcdrow input:focus-visible{outline:none}
.lcdrow span{color:var(--amber);font-size:22px;font-weight:600}
.bump{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bump button{background:#243342;color:#E8EDF2;border:0;border-radius:10px;padding:8px 14px;min-width:52px;font-weight:600}
.bump button.clr{margin-inline-start:auto;background:transparent;color:#9FB0C0}

.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start;display:flex;flex-direction:column;gap:0}
.chip b{font-size:18px;direction:ltr;text-align:start}
.chip small{color:var(--muted);font-size:13px}
.chip.on{border-color:var(--pri);background:var(--soft)}
.chip.low small{color:var(--red)}

.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.field{display:block;margin:12px 0 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:48px}
.field input[dir=ltr]{text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field textarea{width:100%;min-height:150px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);direction:ltr;font-size:13px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px;font-weight:600;color:var(--pri);white-space:nowrap}

.sum{margin-top:18px;border-top:1px solid var(--line)}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sum .big{font-size:28px;font-weight:700;padding:14px 0}
.sum .warn{color:var(--red);font-weight:600}

.btn{width:100%;border:0;border-radius:14px;background:var(--pri);color:var(--onpri);font-weight:700;font-size:17px;padding:14px;margin-top:16px;min-height:52px}
.btn.sec{background:var(--soft);color:var(--pri)}
.btn.slim{width:auto;margin:0;padding:8px 16px;font-size:15px;min-height:40px;border-radius:10px}

.list>div{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600}
.list .s{font-size:13px;color:var(--muted)}
.list .n{font-weight:700;font-size:18px;direction:ltr;font-variant-numeric:tabular-nums}
.name-ltr{direction:ltr;display:inline-block}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warnbg);color:var(--red)}
.debt{color:var(--red)}
.ok{color:var(--green)}
.actions{display:flex;gap:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.tiles div{background:var(--surface);padding:14px}
.tiles small{color:var(--muted);display:block;font-size:13px}
.tiles b{font-size:22px;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:10px;padding:6px 0}
.bar i{display:block;height:12px;border-radius:6px;background:var(--pri);min-width:4px}
.bar span{min-width:64px;direction:ltr;text-align:start;font-weight:600}
.bar em{font-style:normal;color:var(--muted);font-size:14px;margin-inline-start:auto}
.empty{color:var(--muted);padding:18px 0;text-align:center}

nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12.5px;font-weight:500}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);font-weight:700}
.icon-btn svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#sheetWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,15,20,.55)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:19px}
.receipt{background:var(--bg);border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:15px;margin:12px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  
  <button class="icon-btn" data-a="settings" aria-label="الإعدادات">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
  </button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-a="tab" data-t="sell"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>بيع</button>
  <button data-a="tab" data-t="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>المخزون</button>
  <button data-a="tab" data-t="buy"><svg viewBox="0 0 24 24"><path d="M2 6h11v10H2z"/><path d="M13 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>المشتريات</button>
  <button data-a="tab" data-t="cust"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5a3.5 3.5 0 010 6.5M18.5 14.5c1.8.8 3 2.6 3 5.5"/></svg>الحرفاء</button>
  <button data-a="tab" data-t="rep"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</button>
</nav>
<div id="sheetWrap" hidden><div class="scrim" data-a="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
(function(){
var KEY='bags-data-v1';
function $(s){return document.querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString('en-US')}
function two(n){return String(n).padStart(2,'0')}
function ds(d){d=d||new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function pstr(v){return v?String(v):''}

function seed(){
  function sz(id,name){return {id:id,name:name,buy:0,retail:0,whole:0,stock:0}}
  return {cur:'',nextInv:1,
    sizes:[sz('s1','18/30'),sz('s2','18/40'),sz('s3','20/30'),sz('s4','25/30'),sz('s5','25/35'),sz('s6','15/25'),sz('s7','30/30'),sz('s8','30/35')],
    customers:[],sales:[],purchases:[],
    mats:[{id:'m1',name:'Haute',kg:0,cost:0},{id:'m2',name:'Linear',kg:0,cost:0},{id:'m3',name:'Recycler',kg:0,cost:0,rec:true},{id:'m4',name:'ملوّن أسود',kg:0,cost:0}],
    suppliers:[],mpur:[],prod:[],exps:[]};
}
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.sizes){o.sizes.forEach(function(x){if(x.name==='15/30')x.name='15/25'});(o.sales||[]).forEach(function(s){if(s.custName==='\u0632\u0628\u0648\u0646 \u0646\u0642\u062f\u064a')s.custName='دفع نقدا'});if(!o.mats){var d=seed();o.mats=d.mats;o.suppliers=d.suppliers;o.mpur=d.mpur}if(!o.prod)o.prod=[];if(!o.exps)o.exps=[];if(!o.mats.some(function(m){return m.id==='m4'}))o.mats.push({id:'m4',name:'ملوّن أسود',kg:0,cost:0});return o}}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function money(n){return fmt(n)+(S.cur?' '+esc(S.cur):'')}

var tab='sell', period='day', D;
function resetDraft(){
  var sz=S.sizes[0];
  D={sizeId:sz?sz.id:'',type:'retail',kg:'',price:sz?pstr(sz.retail):'',cust:'',paid:'',touched:false,mode:'cash',tQty:'',tType:'',tPrice:''};
}
resetDraft();
function sizeOf(id){return S.sizes.filter(function(x){return x.id===id})[0]}
function custOf(id){return S.customers.filter(function(x){return x.id===id})[0]}

var titles={sell:'فاتورة بيع',stock:'المخزون',buy:'المشتريات',cust:'الحرفاء',rep:'التقارير'};

/* ---------- views ---------- */
function viewSell(){
  if(!S.sizes.length) return '<p class="empty">أضف مقاساً في صفحة المخزون أولاً.</p>';
  var chips=S.sizes.map(function(x){
    return '<button class="chip'+(x.id===D.sizeId?' on':'')+(x.stock<50?' low':'')+'" data-a="size" data-id="'+x.id+'"><b>'+esc(x.name)+'</b><small>متوفر '+fmt(x.stock)+' كغ</small></button>';
  }).join('');
  var custs='<option value="">اختر الحريف (اختياري)</option>'+S.customers.map(function(c){
    return '<option value="'+c.id+'"'+(c.id===D.cust?' selected':'')+'>'+esc(c.name)+'</option>';
  }).join('');
  return ''+
  '<section class="lcd"><label for="kg">الوزن بالكيلوغرام</label>'+
    '<div class="lcdrow"><span>كغ</span><input id="kg" dir="ltr" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(D.kg)+'"></div>'+
    '<div class="bump"><button data-a="bump" data-v="1">+1</button><button data-a="bump" data-v="5">+5</button><button data-a="bump" data-v="10">+10</button><button data-a="bump" data-v="-1">−1</button><button class="clr" data-a="clr">مسح</button></div>'+
  '</section>'+
  '<h2>المقاس (أكياس سوداء)</h2><div class="chips">'+chips+'<button class="chip" data-a="addsize" style="align-items:center;justify-content:center;border-style:dashed"><b style="direction:rtl">إضافة مقاس</b></button></div>'+
  '<div class="seg" style="margin-top:20px"><button class="'+(D.type==='retail'?'on':'')+'" data-a="ptype" data-v="retail">السعر</button><button class="'+(D.type==='whole'?'on':'')+'" data-a="ptype" data-v="whole">مخفض</button></div>'+
  '<label class="field"><span>سعر الكيلو</span><input id="price" dir="ltr" inputmode="decimal" value="'+esc(D.price)+'"></label>'+
  '<div class="seg" style="margin-top:20px"><button class="'+(D.mode==='cash'?'on':'')+'" data-a="pmode" data-v="cash">دفع نقدا</button><button class="'+(D.mode==='badal'?'on':'')+'" data-a="pmode" data-v="badal">بدل</button></div>'+
  (D.mode==='badal'?'<div class="row2">'+field('t_qty','عدد الأشجار',D.tQty,{num:1})+field('t_type','نوع الأشجار',D.tType)+'</div>'+field('t_price','ثمن الأشجار',D.tPrice,{num:1}):'')+
  '<label class="field"><span>الحريف</span><select id="cust">'+custs+'</select></label>'+
  '<div class="inline"><label class="field"><span>المدفوع</span><input id="paid" dir="ltr" inputmode="decimal" value="'+esc(D.paid)+'"></label><button class="ghost" data-a="payfull">دفع كامل</button></div>'+
  '<div class="sum"><div class="big"><span>الإجمالي</span><b id="total">0</b></div><div id="restRow"><span>المتبقي (دين)</span><b id="rest">0</b></div></div>'+
  '<button class="btn" data-a="savesale">حفظ الفاتورة</button>';
}

function viewStock(){
  var tot=S.sizes.reduce(function(a,x){return a+x.stock},0);
  var rows=S.sizes.map(function(x){
    return '<div><div class="grow"><div class="t name-ltr">'+esc(x.name)+'</div>'+(x.stock<50?' <span class="tag">كمية قليلة</span>':'')+
      '<div class="s">الكلفة '+money(x.buy)+' · السعر '+money(x.retail)+' · مخفض '+money(x.whole)+' (للكيلو)</div></div>'+
      '<div class="n">'+fmt(x.stock)+' كغ</div>'+
      '<div class="actions"><button class="ghost slim" style="min-height:40px" data-a="buy" data-id="'+x.id+'">إضافة</button><button class="ghost slim" style="min-height:40px" data-a="editsize" data-id="'+x.id+'">تعديل</button></div></div>';
  }).join('');
  var prodRows=(S.prod||[]).slice(0,6).map(function(q){return '<div><div class="grow"><div class="t"><span class="name-ltr">'+esc(q.sizeName)+'</span> · '+fmt(q.out)+' كغ</div><div class="s">'+q.date+' · دخل '+fmt(q.inK)+' كغ · فاقد '+fmt(Math.max(q.inK-q.out,0))+' كغ · كلفة الكيلو '+money(q.per)+'</div></div><div class="n">'+fmt(q.total)+'</div></div>'}).join('');
  var prodSection='<h2>آخر عمليات التصنيع</h2><div class="list">'+(prodRows||'<p class="empty">لا توجد عمليات تصنيع بعد.</p>')+'</div>';
  return '<button class="btn" style="margin:4px 0 14px" data-a="newprod">تصنيع جديد</button><p style="margin:4px 0 0;color:var(--muted)">إجمالي المخزون</p><p style="margin:0;font-size:30px;font-weight:700">'+fmt(tot)+' كغ</p>'+
    '<div class="list" style="margin-top:8px">'+(rows||'<p class="empty">لا توجد مقاسات بعد.</p>')+'</div>'+
    '<button class="btn sec" data-a="addsize">إضافة مقاس</button>'+prodSection;
}

/* ---------- purchases (raw materials) ---------- */
var P={origin:'bought',paidTouched:false};
function matOf(id){return S.mats.filter(function(m){return m.id===id})[0]}
function supOf(id){return S.suppliers.filter(function(m){return m.id===id})[0]}

function viewBuy(){
  var mrows=S.mats.map(function(m){
    return '<div><div class="grow"><div class="t name-ltr">'+esc(m.name)+'</div><div class="s">كلفة الكيلو '+money(m.cost)+'</div></div><div class="n">'+fmt(m.kg)+' كغ</div></div>';
  }).join('');
  var srows=S.suppliers.map(function(q){
    return '<div><div class="grow"><div class="t">'+esc(q.name)+'</div><div class="s">'+(esc(q.phone)||'بدون رقم هاتف')+'</div></div><div class="n '+(q.debt>0?'debt':'ok')+'">'+(q.debt>0?money(q.debt):'لا دين')+'</div>'+(q.debt>0?'<button class="ghost slim" style="min-height:40px" data-a="paysup" data-id="'+q.id+'">تسديد</button>':'')+'</div>';
  }).join('');
  var prows=S.mpur.slice(0,8).map(function(x){
    return '<div><div class="grow"><div class="t"><span class="name-ltr">'+esc(x.matName)+'</span> · '+fmt(x.kg)+' كغ'+(x.origin==='own'?' <span class="tag" style="background:var(--soft);color:var(--pri)">متاعي</span>':'')+'</div>'+
      '<div class="s">'+esc(x.supName)+(x.inv?' · فاتورة '+esc(x.inv):'')+' · '+x.date+' · كلفة الكيلو '+money(x.kg?x.total/x.kg:0)+(x.rest>0?' · متبقي '+money(x.rest):'')+'</div></div><div class="n">'+fmt(x.total)+'</div></div>';
  }).join('');
  return '<button class="btn" style="margin-top:4px" data-a="newpur">فاتورة شراء جديدة</button>'+
    '<h2>مخزون المواد الأولية</h2><div class="list">'+mrows+'</div>'+
    '<h2>المزودون</h2><div class="list">'+(srows||'<p class="empty">لا يوجد مزودون بعد.</p>')+'</div><button class="btn sec" data-a="addsup">إضافة مزود</button>'+
    '<h2>آخر المشتريات</h2><div class="list">'+(prows||'<p class="empty">لا توجد مشتريات بعد.</p>')+'</div>';
}

function openPurchase(){
  P={origin:'bought',paidTouched:false};
  var opts=S.mats.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join('')+'<option value="__new">+ نوعية أخرى</option>';
  var sups='<option value="">اختر المزود</option>'+S.suppliers.map(function(q){return '<option value="'+q.id+'">'+esc(q.name)+'</option>'}).join('')+'<option value="__new">+ مزود جديد</option>';

    '<div id="b_supbox"><label class="field"><span>المزود</span><select id="b_sup">'+sups+'</select></label><div id="b_newsup" hidden>'+field('b_supname','اسم المزود الجديد','')+'</div>'+field('b_inv','رقم الفاتورة','')+'</div>'+

function updateBox(){
  var m=matOf(val('b_mat')),isRec=!!(m&&m.rec);
  if(!isRec)P.origin='bought';
  var own=isRec&&P.origin==='own';
  Array.prototype.forEach.call(document.querySelectorAll('[data-a="borigin"]'),function(bb){bb.classList.toggle('on',bb.getAttribute('data-v')===P.origin)});
  $('#b_newmat').hidden=val('b_mat')!=='__new';
  $('#b_originbox').hidden=!isRec;
  $('#b_supbox').hidden=own;
  $('#b_recbox').hidden=!own;
  $('#b_paidbox').hidden=own;
  $('#b_newsup').hidden=val('b_sup')!=='__new';
  $('#b_restRow').hidden=own;
}
function calcP(){
  if(!$('#b_total'))return;
  var m=matOf(val('b_mat')),own=!!(m&&m.rec)&&P.origin==='own';
  var kg=num('b_kg'),pr=num('b_price'),rc=own?num('b_recost'):0,ld=num('b_load');
  var total=kg*(pr+rc)+ld;
  if(own||!P.paidTouched){var pe=$('#b_paid');if(pe)pe.value=total?String(Math.round(total*100)/100):''}
  var paid=own?total:num('b_paid');
  $('#b_total').textContent=money(total);
  $('#b_per').textContent=money(kg?total/kg:0);
  $('#b_rest').textContent=money(Math.max(total-paid,0));
}
function savePur(){
  var sel=val('b_mat'),m;
  if(sel==='__new'){var nm=val('b_matname');if(!nm)return toast('اكتب اسم النوعية');m={id:uid('m'),name:nm,kg:0,cost:0,rec:false}}
  else m=matOf(sel);
  var own=!!m.rec&&P.origin==='own';
  var kg=num('b_kg'),pr=num('b_price'),rc=own?num('b_recost'):0,ld=num('b_load');
  if(kg<=0)return toast('اكتب الكمية');
  if(!own&&pr<=0)return toast('اكتب ثمن الكيلو');
  var sup=null;
  if(!own){
    var ss=val('b_sup');if(!ss)return toast('اختر المزود');
    if(ss==='__new'){var sn=val('b_supname');if(!sn)return toast('اكتب اسم المزود');sup={id:uid('p'),name:sn,phone:'',debt:0}}
    else sup=supOf(ss);
  }
  var total=kg*(pr+rc)+ld, paid=own?total:(P.paidTouched?num('b_paid'):total);
  if(paid>total+0.001)return toast('المدفوع أكبر من إجمالي الفاتورة');
  var rest=Math.max(total-paid,0);
  if(sel==='__new')S.mats.push(m);
  if(sup&&!supOf(sup.id))S.suppliers.push(sup);
  var nk=m.kg+kg;m.cost=nk?(m.kg*m.cost+total)/nk:0;m.kg=Math.round(nk*100)/100;
  if(sup)sup.debt=Math.round((sup.debt+rest)*100)/100;
  S.mpur.unshift({date:val('b_date')||ds(),supId:sup?sup.id:'',supName:sup?sup.name:'متاعي',inv:val('b_inv'),matId:m.id,matName:m.name,origin:own?'own':'bought',kg:kg,price:pr,recost:rc,load:ld,total:total,paid:paid,rest:rest,notes:val('b_notes')});
  save();closeSheet();render();toast('تم حفظ فاتورة الشراء');
}

    '<div class="list" style="margin-top:8px">'+(rows||'<p class="empty">لا يوجد حرفاء بعد.</p>')+'</div>'+

}

function inPeriod(s){var t=ds();return period==='day'?s.date===t:s.date.slice(0,7)===t.slice(0,7)}

  var kg=0,rev=0,prof=0,by={};
  ss.forEach(function(s){kg+=s.kg;rev+=s.total;prof+=(s.price-s.cost)*s.kg;by[s.sizeName]=(by[s.sizeName]||0)+s.kg});
  var names=Object.keys(by).sort(function(a,b){return by[b]-by[a]}), max=names.length?by[names[0]]:1;
  var bars=names.map(function(n){return '<div class="bar"><span>'+esc(n)+'</span><i style="width:'+Math.max(4,Math.round(by[n]/max*55))+'%"></i><em>'+fmt(by[n])+' كغ</em></div>'}).join('');
  var debts=S.customers.reduce(function(a,c){return a+c.debt},0);
  var tr=ss.filter(function(s){return s.trees});
  var pt=(S.mpur||[]).filter(inPeriod).reduce(function(a,x){return a+x.total},0);
  var sd=(S.suppliers||[]).reduce(function(a,x){return a+x.debt},0);
  var exl=(S.exps||[]).filter(inPeriod);var ex=exl.reduce(function(a,x){return a+x.amt},0);
  var exh='<h2>المصاريف</h2><div class="list">'+(exl.slice(0,8).map(function(x){return '<div><div class="grow"><div class="t">'+esc(x.cat)+'</div><div class="s">'+(x.note?esc(x.note)+' · ':'')+x.date+'</div></div><div class="n">'+fmt(x.amt)+'</div></div>'}).join('')||'<p class="empty">لا توجد مصاريف في هذه الفترة.</p>')+'</div><button class="btn sec" data-a="addexp">إضافة مصروف</button>';
  var trh=tr.length?'<h2>أشجار اشتريتها (بدل)</h2><div class="list">'+tr.map(function(s){return '<div><div class="grow"><div class="t">'+esc(s.trees.type)+' · '+fmt(s.trees.qty)+' شجرة</div><div class="s">فاتورة '+s.n+' · '+s.date+'</div></div><div class="n">'+fmt(s.trees.price)+'</div></div>'}).join('')+'</div>':'';
  var last=ss.slice(0,6).map(function(s){
    return '<div><div class="grow"><div class="t">فاتورة '+s.n+' · '+esc(s.custName)+'</div><div class="s"><span class="name-ltr">'+esc(s.sizeName)+'</span> · '+fmt(s.kg)+' كغ · '+s.date+'</div></div><div class="n">'+fmt(s.total)+'</div></div>';
  }).join('');
  return '<div class="seg"><button class="'+(period==='day'?'on':'')+'" data-a="period" data-v="day">اليوم</button><button class="'+(period==='month'?'on':'')+'" data-a="period" data-v="month">هذا الشهر</button></div>'+
    '<div class="tiles"><div><small>الكمية المباعة</small><b>'+fmt(kg)+' كغ</b></div><div><small>المبيعات</small><b>'+money(rev)+'</b></div><div><small>الربح</small><b class="ok">'+money(prof)+'</b></div><div><small>الديون عند الحرفاء</small><b class="debt">'+money(debts)+'</b></div><div><small>مشتريات المواد</small><b>'+money(pt)+'</b></div><div><small>ديون المزودين</small><b class="debt">'+money(sd)+'</b></div><div><small>المصاريف</small><b>'+money(ex)+'</b></div><div><small>الصافي (الربح − المصاريف)</small><b class="'+(prof-ex>=0?'ok':'debt')+'">'+money(prof-ex)+'</b></div></div>'+
    '<h2>المقاسات الأكثر مبيعاً</h2>'+(bars||'<p class="empty">لا توجد مبيعات في هذه الفترة.</p>')+
    trh+exh+'<h2>آخر الفواتير</h2><div class="list">'+(last||'<p class="empty">لا توجد فواتير.</p>')+'</div>';
}

function render(){
  $('#title').textContent=titles[tab];
  var v=$('#view');
  v.innerHTML=({sell:viewSell,stock:viewStock,buy:viewBuy,cust:viewCust,rep:viewRep})[tab]();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===tab)});
  if(tab==='sell')updateTotals();
}

function updateTotals(){
  var kg=parseFloat(D.kg)||0, pr=parseFloat(D.price)||0, total=kg*pr;
  if(!D.touched){var base=D.mode==='badal'?Math.min(parseFloat(D.tPrice)||0,total):total;D.paid=base?String(Math.round(base*100)/100):''}
  var paid=parseFloat(D.paid)||0, rest=Math.max(total-paid,0);
  var t=$('#total'),r=$('#rest'),p=$('#paid'),rr=$('#restRow');
  if(!t)return;
  t.textContent=money(total);r.textContent=money(rest);
  if(p&&document.activeElement!==p)p.value=D.paid;
  rr.classList.toggle('warn',rest>0);
}

/* ---------- sheets & toast ---------- */
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetWrap').hidden=false;var f=$('#sheet input');if(f)setTimeout(function(){f.focus()},50)}
function closeSheet(){$('#sheetWrap').hidden=true;$('#sheet').innerHTML=''}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2600)}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
function num(id){return parseFloat(val(id))||0}

function field(id,label,v,opt){opt=opt||{};return '<label class="field"><span>'+label+'</span><input id="'+id+'" value="'+esc(v==null?'':v)+'"'+(opt.num?' dir="ltr" inputmode="decimal"':'')+' autocomplete="off"></label>'}

/* ---------- production ---------- */
function openProd(){
  if(!S.sizes.length)return toast('أضف مقاساً أولاً');
  var szs=S.sizes.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('');
  var mrows=S.mats.map(function(m){return field('pm_'+m.id,esc(m.name)+' — متوفر '+fmt(m.kg)+' كغ','',{num:1})}).join('');
  openSheet('<h3>تصنيع أكياس</h3><label class="field"><span>المقاس</span><select id="pr_size">'+szs+'</select></label>'+
    '<label class="field"><span>التاريخ</span><input id="pr_date" type="date" value="'+ds()+'"></label>'+
    '<h2>المواد المستعملة (كغ)</h2>'+mrows+
    '<h2>النتيجة</h2>'+field('pr_out','كمية الأكياس الخارجة (كغ)','',{num:1})+field('pr_other','مصاريف أخرى للتصنيع (كهرباء، عمال…)','',{num:1})+
    '<div class="sum"><div><span>المواد الداخلة</span><b id="pr_in">0</b></div><div><span>الفاقد</span><b id="pr_waste">—</b></div><div class="big"><span>كلفة كيلو الأكياس</span><b id="pr_cost">0</b></div></div>'+
    '<button class="btn" data-a="saveprod">حفظ التصنيع</button>');
  calcProd();
}
function calcProd(){
  if(!$('#pr_in'))return;
  var inK=0,cost=0;
  S.mats.forEach(function(m){var k=num('pm_'+m.id);inK+=k;cost+=k*m.cost});
  var out=num('pr_out'),tot=cost+num('pr_other'),w=Math.max(inK-out,0);
  $('#pr_in').textContent=fmt(inK)+' كغ';
  $('#pr_waste').textContent=out?fmt(w)+' كغ ('+fmt(inK?w/inK*100:0)+'%)':'—';
  $('#pr_cost').textContent=money(out?tot/out:0);
}
function saveProd(){
  var sz=sizeOf(val('pr_size'));if(!sz)return toast('اختر المقاس');
  var used=[],inK=0,cost=0;
  for(var i=0;i<S.mats.length;i++){
    var m=S.mats[i],k=num('pm_'+m.id);
    if(k>0){
      if(k>m.kg+0.001)return toast('المتوفر من '+m.name+' '+fmt(m.kg)+' كغ فقط');
      used.push({id:m.id,name:m.name,kg:k,cost:m.cost});inK+=k;cost+=k*m.cost;
    }
  }
  var out=num('pr_out'),oth=num('pr_other');
  if(!used.length)return toast('اكتب المواد المستعملة');
  if(out<=0)return toast('اكتب كمية الأكياس الخارجة');
  if(out>inK+0.001)return toast('الأكياس الخارجة أكبر من المواد الداخلة');
  var total=cost+oth,per=total/out;
  used.forEach(function(u){var mm=matOf(u.id);mm.kg=Math.round((mm.kg-u.kg)*100)/100});
  var ns=sz.stock+out;
  sz.buy=ns?Math.round(((sz.stock*sz.buy+total)/ns)*100)/100:per;
  sz.stock=Math.round(ns*100)/100;
  S.prod.unshift({date:val('pr_date')||ds(),sizeId:sz.id,sizeName:sz.name,used:used,inK:inK,out:out,other:oth,total:total,per:per});
  save();closeSheet();render();toast('تم حفظ التصنيع');
}

/* ---------- actions ---------- */
function saveSale(){
  var sz=sizeOf(D.sizeId),kg=parseFloat(D.kg)||0,pr=parseFloat(D.price)||0,total=kg*pr;
  if(!sz)return toast('اختر مقاساً');
  if(kg<=0)return toast('اكتب الوزن بالكيلو');
  if(pr<=0)return toast('اكتب سعر الكيلو');
  var tp=D.mode==='badal'?(parseFloat(D.tPrice)||0):0;
  if(D.mode==='badal'){if(!(parseFloat(D.tQty)>0))return toast('اكتب عدد الأشجار');if(!D.tType.trim())return toast('اكتب نوع الأشجار');if(tp<=0)return toast('اكتب ثمن الأشجار');if(tp>total+0.001)return toast('ثمن الأشجار أكبر من إجمالي الفاتورة')}
  if(kg>sz.stock)return toast('المتوفر من هذا المقاس '+fmt(sz.stock)+' كغ فقط');
  var paid=D.touched?(parseFloat(D.paid)||0):(D.mode==='badal'?Math.min(tp,total):total);
  if(paid>total+0.001)return toast('المدفوع أكبر من الإجمالي');
  var rest=Math.max(total-paid,0), c=custOf(D.cust);
  if(rest>0.001&&!c)return toast('اختر حريفاً لتسجيل المتبقي كدين');
  var sale={n:S.nextInv++,date:ds(),ts:Date.now(),custId:c?c.id:'',custName:c?c.name:(D.mode==='badal'?'بدل':'دفع نقدا'),sizeId:sz.id,sizeName:sz.name,kg:kg,price:pr,cost:sz.buy,total:total,paid:paid,rest:rest,mode:D.mode,trees:D.mode==='badal'?{qty:parseFloat(D.tQty)||0,type:D.tType.trim(),price:tp}:null};
  S.sales.unshift(sale);sz.stock=Math.round((sz.stock-kg)*100)/100;
  if(c&&rest>0)c.debt=Math.round((c.debt+rest)*100)/100;
  save();resetDraft();
  var txt='فاتورة رقم '+sale.n+'\nالتاريخ: '+sale.date+'\nالحريف: '+sale.custName+'\nأكياس سوداء - مقاس '+sale.sizeName+'\nالوزن: '+fmt(kg)+' كغ × '+fmt(pr)+'\nالإجمالي: '+money(total)+'\nالمدفوع: '+money(paid)+'\nالمتبقي: '+money(rest);if(sale.trees)txt+='\nبدل: '+fmt(sale.trees.qty)+' شجرة '+sale.trees.type+' بثمن '+money(sale.trees.price);
  openSheet('<h3>تم حفظ الفاتورة</h3><div class="receipt" id="rtxt">'+esc(txt)+'</div><button class="btn" data-a="share" data-txt="'+esc(txt)+'">مشاركة الفاتورة</button><button class="btn sec" data-a="done">تم</button>');
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  if(a==='tab'){tab=el.getAttribute('data-t');render();window.scrollTo(0,0)}
  else if(a==='close'){closeSheet()}
  else if(a==='done'){closeSheet();render()}
  else if(a==='size'){D.sizeId=id;var sz=sizeOf(id);D.price=pstr(D.type==='whole'?sz.whole:sz.retail);render()}
  else if(a==='ptype'){D.type=v;var s2=sizeOf(D.sizeId);if(s2)D.price=pstr(v==='whole'?s2.whole:s2.retail);render()}
  else if(a==='bump'){D.kg=String(Math.max(0,Math.round(((parseFloat(D.kg)||0)+parseFloat(v))*100)/100)||'');var k=$('#kg');if(k)k.value=D.kg;updateTotals()}
  else if(a==='clr'){D.kg='';var k2=$('#kg');if(k2)k2.value='';updateTotals()}

    var txt=el.getAttribute('data-txt');

    try{navigator.clipboard.writeText(txt).then(function(){toast('تم نسخ الفاتورة')},function(){toast('انسخ النص من الأعلى')})}catch(y){toast('انسخ النص من الأعلى')}
  }
  else if(a==='pmode'){D.mode=v;D.touched=false;render()}
  else if(a==='newpur'){openPurchase()}
  else if(a==='newprod'){openProd()}
  else if(a==='saveprod'){saveProd()}
  else if(a==='addexp'){openSheet('<h3>مصروف جديد</h3><label class="field"><span>النوع</span><select id="ex_cat"><option>كهرباء</option><option>عمال</option><option>صيانة</option><option>نقل</option><option>إيجار</option><option>أخرى</option></select></label>'+field('ex_amt','المبلغ','',{num:1})+'<label class="field"><span>التاريخ</span><input id="ex_date" type="date" value="'+ds()+'"></label>'+field('ex_note','ملاحظة (اختياري)','')+'<button class="btn" data-a="saveexp">حفظ</button>')}
  else if(a==='saveexp'){var ea=num('ex_amt');if(ea<=0)return toast('اكتب المبلغ');S.exps.unshift({date:val('ex_date')||ds(),cat:val('ex_cat'),amt:ea,note:val('ex_note')});save();closeSheet();render();toast('تم حفظ المصروف')}
  else if(a==='backup'){openSheet('<h3>نسخة احتياطية</h3><p style="color:var(--muted);margin:4px 0">انسخ هذا النص كله واحفظه في مكان آمن (رسالة لنفسك مثلاً). به كل بياناتك.</p><label class="field"><textarea id="bk" readonly>'+esc(JSON.stringify(S))+'</textarea></label><button class="btn" data-a="copybk">نسخ النص</button>')}
  else if(a==='copybk'){var bkEl=$('#bk');bkEl.select();try{navigator.clipboard.writeText(bkEl.value).then(function(){toast('تم النسخ')},function(){toast('حدد النص وانسخه يدوياً')})}catch(ex2){toast('حدد النص وانسخه يدوياً')}}
  else if(a==='restore'){openSheet('<h3>استرجاع نسخة</h3><p style="color:var(--muted);margin:4px 0">الصق النص الذي نسخته سابقاً. سيحل محل البيانات الحالية.</p><label class="field"><textarea id="rs"></textarea></label><button class="btn" data-a="dorestore">استرجاع</button>')}
  else if(a==='dorestore'){try{var o2=JSON.parse(val('rs'));if(!o2||!o2.sizes||!o2.sales)throw 0;var d2=seed();if(!o2.mats){o2.mats=d2.mats;o2.suppliers=d2.suppliers;o2.mpur=[]}o2.prod=o2.prod||[];o2.exps=o2.exps||[];o2.customers=o2.customers||[];S=o2;save();resetDraft();closeSheet();render();toast('تم الاسترجاع')}catch(er){toast('النص غير صحيح')}}
  else if(a==='savepur'){savePur()}
  else if(a==='borigin'){P.origin=v;Array.prototype.forEach.call(document.querySelectorAll('[data-a="borigin"]'),function(bb){bb.classList.toggle('on',bb.getAttribute('data-v')===v)});updateBox();calcP()}
  else if(a==='addsup'){openSheet('<h3>مزود جديد</h3>'+field('sp_name','الاسم','')+field('sp_phone','رقم الهاتف (اختياري)','',{num:1})+'<button class="btn" data-a="savesup">حفظ</button>')}
  else if(a==='savesup'){var sn2=val('sp_name');if(!sn2)return toast('اكتب اسم المزود');S.suppliers.push({id:uid('p'),name:sn2,phone:val('sp_phone'),debt:0});save();closeSheet();render();toast('تمت إضافة المزود')}
  else if(a==='paysup'){var p3=supOf(id);openSheet('<h3>تسديد للمزود '+esc(p3.name)+'</h3><p style="margin:4px 0;color:var(--muted)">الدين الحالي: '+money(p3.debt)+'</p>'+field('sd_amt','المبلغ المدفوع',p3.debt,{num:1})+'<button class="btn" data-a="savepaysup" data-id="'+id+'">تسجيل الدفعة</button>')}
  else if(a==='savepaysup'){var p4=supOf(id),am=num('sd_amt');if(am<=0)return toast('اكتب المبلغ');if(am>p4.debt+0.001)return toast('المبلغ أكبر من الدين');p4.debt=Math.max(0,Math.round((p4.debt-am)*100)/100);save();closeSheet();render();toast('تم تسجيل الدفعة')}
  else if(a==='period'){period=v;render()}
  else if(a==='addsize'||a==='editsize'){
    var s=a==='editsize'?sizeOf(id):null;
    openSheet('<h3>'+(s?'تعديل المقاس':'مقاس جديد')+'</h3>'+field('f_name','المقاس (مثل 18/30)',s?s.name:'')+
      '<div class="row2">'+field('f_buy','الكلفة للكيلو',s?s.buy:'',{num:1})+field('f_retail','السعر (للكيلو)',s?s.retail:'',{num:1})+'</div>'+
      field('f_whole','السعر المخفض (للكيلو)',s?s.whole:'',{num:1})+(s?'':field('f_stock','الكمية الحالية (كغ)','',{num:1}))+
      '<button class="btn" data-a="savesize" data-id="'+(s?s.id:'')+'">حفظ</button>');
  }
  else if(a==='savesize'){
    var name=val('f_name');if(!name)return toast('اكتب المقاس');
    var o=id?sizeOf(id):{id:uid('s'),stock:0};
    o.name=name;o.buy=num('f_buy');o.retail=num('f_retail');o.whole=num('f_whole')||o.retail;
    if(!id){o.stock=num('f_stock');S.sizes.push(o);D.sizeId=o.id;D.price=pstr(D.type==='whole'?o.whole:o.retail)}
    save();closeSheet();if(!D.sizeId||!sizeOf(D.sizeId))resetDraft();render();toast('تم الحفظ');
  }
  else if(a==='buy'){
    var b=sizeOf(id);
    openSheet('<h3>إضافة كمية جاهزة - مقاس '+esc(b.name)+'</h3>'+field('p_kg','الكمية المشتراة (كغ)','',{num:1})+field('p_cost','سعر الشراء للكيلو',b.buy,{num:1})+field('p_sup','المزود (اختياري)','')+
      '<button class="btn" data-a="savebuy" data-id="'+id+'">إضافة للمخزون</button>');
  }
  else if(a==='savebuy'){
    var b2=sizeOf(id),kg2=num('p_kg'),cost=num('p_cost');
    if(kg2<=0)return toast('اكتب الكمية');
    b2.stock=Math.round((b2.stock+kg2)*100)/100;if(cost>0)b2.buy=cost;
    S.purchases.unshift({date:ds(),sizeId:id,kg:kg2,cost:cost,supplier:val('p_sup')});
    save();closeSheet();render();toast('تمت إضافة '+fmt(kg2)+' كغ');
  }
  else if(a==='addcust'){
    openSheet('<h3>حريف جديد</h3>'+field('c_name','الاسم','')+field('c_phone','رقم الهاتف (اختياري)','',{num:1})+'<button class="btn" data-a="savecust">حفظ</button>');
  }
  else if(a==='savecust'){
    var cn=val('c_name');if(!cn)return toast('اكتب اسم الحريف');
    S.customers.push({id:uid('c'),name:cn,phone:val('c_phone'),debt:0});save();closeSheet();render();toast('تمت إضافة الحريف');
  }
  else if(a==='pay'){
    var c3=custOf(id);
    openSheet('<h3>تسديد من '+esc(c3.name)+'</h3><p style="margin:4px 0;color:var(--muted)">الدين الحالي: '+money(c3.debt)+'</p>'+field('d_amt','المبلغ المدفوع',c3.debt,{num:1})+'<button class="btn" data-a="savepay" data-id="'+id+'">تسجيل الدفعة</button>');
  }
  else if(a==='savepay'){
    var c4=custOf(id),amt=num('d_amt');
    if(amt<=0)return toast('اكتب المبلغ');
    if(amt>c4.debt+0.001)return toast('المبلغ أكبر من الدين');
    c4.debt=Math.max(0,Math.round((c4.debt-amt)*100)/100);save();closeSheet();render();toast('تم تسجيل الدفعة');
  }
  else if(a==='settings'){
    openSheet('<h3>الإعدادات</h3>'+field('s_cur','اسم العملة (يظهر بجانب المبالغ)',S.cur)+
      '<button class="btn" data-a="savecur">حفظ</button><button class="btn sec" data-a="backup">نسخة احتياطية للبيانات</button><button class="btn sec" data-a="restore">استرجاع نسخة احتياطية</button><button class="btn sec" style="color:var(--red)" data-a="askwipe">مسح كل البيانات</button>');
  }
  else if(a==='savecur'){S.cur=val('s_cur');save();closeSheet();render()}
  else if(a==='askwipe'){openSheet('<h3>مسح كل البيانات؟</h3><p style="color:var(--muted)">سيتم حذف كل الفواتير والمخزون والحرفاء والمزودين والمشتريات. لا يمكن التراجع إلا بنسخة احتياطية.</p><button class="btn" style="background:var(--red);color:var(--onpri)" data-a="wipe">نعم، امسح كل شيء</button><button class="btn sec" data-a="close">إلغاء</button>')}
  else if(a==='wipe'){var cur=S.cur;S=seed();S.cur=cur;save();resetDraft();closeSheet();render();toast('تم مسح البيانات')}
});

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='kg'){D.kg=e.target.value;updateTotals()}
  else if(id==='price'){D.price=e.target.value;updateTotals()}
  else if(id==='paid'){D.paid=e.target.value;D.touched=true;updateTotals()}
  else if(id==='t_qty'){D.tQty=e.target.value}
  else if(id==='t_type'){D.tType=e.target.value}
  else if(id==='t_price'){D.tPrice=e.target.value;updateTotals()}
  else if(id&&id.indexOf('b_')===0){if(id==='b_paid')P.paidTouched=true;calcP()}
  else if(id&&(id.indexOf('pm_')===0||id==='pr_out'||id==='pr_other')){calcProd()}
});
document.addEventListener('change',function(e){var i=e.target.id;if(i==='cust'){D.cust=e.target.value}else if(i==='b_mat'||i==='b_sup'){updateBox();calcP()}});

render();
})();
</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});
}
</script>
